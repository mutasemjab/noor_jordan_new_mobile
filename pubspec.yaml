name: noor
description: "مدارس نور الأردن الدولية - Noor Jordan International Schools"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dartz: ^0.10.1

  # HTTP & Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.5.0

  # Navigation
  go_router: ^14.6.1

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Firebase
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

  # Notifications
  flutter_local_notifications: ^18.0.1

  # UI & Animations
  shimmer: ^3.0.0
  lottie: ^3.1.3
  animations: ^2.0.11
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Charts
  fl_chart: ^0.69.0

  # Calendar
  table_calendar: ^3.1.2

  # Video
  youtube_player_flutter: ^9.1.1

  # Media
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Utilities
  url_launcher: ^6.3.1
  fluttertoast: ^8.2.8
  intl: ^0.19.0
  pull_to_refresh: ^2.0.0

  # Google Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  injectable_generator: ^2.7.0
  build_runner: ^2.4.13

dependency_overrides:
  win32: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/

  # Using google_fonts package for Cairo — no local font files needed
